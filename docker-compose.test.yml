version: '3.8'

services:
  # PostgreSQL Database for Test
  postgres-test:
    image: postgres:15-alpine
    container_name: superelf-postgres-test
    restart: unless-stopped
    environment:
      POSTGRES_DB: SuperelfDbTest
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${TEST_DB_PASSWORD}
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    networks:
      - superelf-test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # .NET API for Test
  api-test:
    build:
      context: .
      dockerfile: Superelf.API/Dockerfile
    container_name: superelf-api-test
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Test
      ConnectionStrings__DefaultConnection: "Host=postgres-test;Port=5432;Database=SuperelfDbTest;Username=postgres;Password=${TEST_DB_PASSWORD}"
      JwtSettings__Key: ${TEST_JWT_SECRET}
      JwtSettings__Issuer: SuperelfAPI
      JwtSettings__Audience: SuperelfClient
      JwtSettings__ExpiryInMinutes: 60
      AllowedOrigins__0: https://superelf-test.yorickteriele.nl
    depends_on:
      postgres-test:
        condition: service_healthy
    networks:
      - superelf-test
    ports:
      - "5001:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/api/diagnostics/ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # React Frontend for Test
  frontend-test:
    build:
      context: ./Superelf.Web
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: /api
        REACT_APP_ENVIRONMENT: test
    container_name: superelf-frontend-test
    restart: unless-stopped
    networks:
      - superelf-test
    ports:
      - "3001:3000"
    depends_on:
      - api-test

volumes:
  postgres_test_data:
    driver: local

networks:
  superelf-test:
    driver: bridge
