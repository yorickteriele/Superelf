version: '3.8'

services:
  postgres-prod:
    image: postgres:15-alpine
    container_name: superelf-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: SuperelfDb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${PROD_DB_PASSWORD}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    networks:
      - superelf-prod
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  api-prod:
    build:
      context: .
      dockerfile: Superelf.API/Dockerfile
    container_name: superelf-api-prod
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Host=postgres-prod;Port=5432;Database=SuperelfDb;Username=postgres;Password=${PROD_DB_PASSWORD}"
      JwtSettings__Key: ${PROD_JWT_SECRET}
      JwtSettings__Issuer: SuperelfAPI
      JwtSettings__Audience: SuperelfClient
      JwtSettings__ExpiryInMinutes: 60
      AllowedOrigins__0: https://superelf.yorickteriele.nl
    depends_on:
      postgres-prod:
        condition: service_healthy
    networks:
      - superelf-prod
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.superelf-api-prod.rule=Host(`superelf.yorickteriele.nl`) && (PathPrefix(`/api`) || PathPrefix(`/hub`))"
      - "traefik.http.routers.superelf-api-prod.entrypoints=websecure"
      - "traefik.http.routers.superelf-api-prod.tls.certresolver=letsencrypt"
      - "traefik.http.routers.superelf-api-prod.priority=10"
      - "traefik.http.services.superelf-api-prod.loadbalancer.server.port=8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/api/diagnostics/ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend-prod:
    build:
      context: ./Superelf.Web
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: /api
        REACT_APP_ENVIRONMENT: production
    container_name: superelf-frontend-prod
    restart: unless-stopped
    networks:
      - superelf-prod
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.superelf-frontend-prod.rule=Host(`superelf.yorickteriele.nl`)"
      - "traefik.http.routers.superelf-frontend-prod.entrypoints=websecure"
      - "traefik.http.routers.superelf-frontend-prod.tls.certresolver=letsencrypt"
      - "traefik.http.services.superelf-frontend-prod.loadbalancer.server.port=3000"
    depends_on:
      - api-prod

volumes:
  postgres_prod_data:
    external: true
    name: superelf-prod_postgres_prod_data

networks:
  superelf-prod:
    driver: bridge
  dokploy-network:
    external: true
    name: dokploy-network
